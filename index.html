<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Malayalam Mitram</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Chettan+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&family=Noto+Sans+Malayalam:wght@400;600;700&family=Noto+Serif+Malayalam:wght@600;800&family=Noto+Sans+Tamil:wght@400;600;700&display=swap">
<style>
/* Layout concept: one narrow app column. Sticky nav, a deep-green hero with a kasavu (gold double line) edge, big chunky glyph cards for lessons, large tap targets for quizzes. */
:root {
  --bg: #FBF5E4;
  --dot: #EADBB0;
  --surface: #FFFDF6;
  --surface2: #F3E9CE;
  --ink: #2B1A10;
  --muted: #6B5744;
  --line: #E3D3A8;
  --accent: #8A2420;
  --primary: #1E6B3B;
  --primary-ink: #FFFFFF;
  --gold: #C8921C;
  --gold-soft: #F8E7B2;
  --gold-ink: #3A2600;
  --hero: #7E1F1B;
  --hero-ink: #FFF4DA;
  --good: #1E6B3B;
  --good-bg: #DCEBD3;
  --bad: #A12B22;
  --bad-bg: #F6DAD3;
  --font-display: "Baloo Chettan 2", "Noto Sans Malayalam", system-ui, sans-serif;
  --font-body: "Nunito", "Noto Sans Tamil", "Noto Sans Malayalam", system-ui, sans-serif;
  --font-ml: "Noto Serif Malayalam", "Baloo Chettan 2", "Noto Sans Malayalam", serif;
  --font-ta: "Noto Sans Tamil", "Nunito", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1A110B; --dot: #2A1D13; --surface: #261A12; --surface2: #33241A; --ink: #F6EBD0; --muted: #BBA787; --line: #4A3524; --accent: #F2B8A0;
    --primary: #6CBF84; --primary-ink: #0C2214; --gold: #E3B04B; --gold-soft: #3F3015; --gold-ink: #F8E7B2;
    --hero: #5E1713; --hero-ink: #FFF4DA; --good: #8FD39F; --good-bg: #1F3A26; --bad: #F29A8F; --bad-bg: #43211C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1A110B; --dot: #2A1D13; --surface: #261A12; --surface2: #33241A; --ink: #F6EBD0; --muted: #BBA787; --line: #4A3524; --accent: #F2B8A0;
  --primary: #6CBF84; --primary-ink: #0C2214; --gold: #E3B04B; --gold-soft: #3F3015; --gold-ink: #F8E7B2;
  --hero: #5E1713; --hero-ink: #FFF4DA; --good: #8FD39F; --good-bg: #1F3A26; --bad: #F29A8F; --bad-bg: #43211C;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); background-image: radial-gradient(var(--dot) 1.2px, transparent 1.6px); background-size: 22px 22px;
  color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-block: 0 112px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.shell { max-width: 880px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; margin: 0; text-wrap: balance; }
h2 { font-size: 1.5rem; color: var(--accent); } h3 { font-size: 1.15rem; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--primary); }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.ml { font-family: var(--font-ml); }
.ta { font-family: var(--font-ta); }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
.label { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding-block: 10px 0; }
.bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; padding-bottom: 10px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); min-width: 0; }
.mark { width: 40px; height: 40px; border-radius: 12px; background: var(--hero); color: var(--gold); display: grid; place-items: center; font-family: var(--font-ml); font-size: 1.7rem; font-weight: 800; flex: none; }
.brand b { font-family: var(--font-display); font-size: 1.2rem; font-weight: 800; }
.kasavu { height: 14px; background: radial-gradient(circle at 7px 7px, var(--hero) 2.2px, transparent 2.8px) 0 0 / 14px 14px, var(--gold); }
.top .kasavu { height: 10px; background: radial-gradient(circle at 5px 5px, var(--hero) 1.6px, transparent 2.2px) 0 0 / 10px 10px, var(--gold); }
main { padding-top: 20px; display: grid; gap: 20px; }

/* hero */
.hero { position: relative; background: var(--hero); color: var(--hero-ink); border-radius: 14px; padding: 22px 20px 0; overflow: hidden; }
.hero .greet { font-family: var(--font-ml); font-size: clamp(2rem, 8.5vw, 3.1rem); font-weight: 800; line-height: 1.25; color: var(--gold-soft); padding-right: 80px; }
.hero .sub { padding-right: 80px; }
.lamp { position: absolute; top: 16px; right: 18px; width: 52px; height: auto; color: var(--gold); }
.hero .sub { opacity: 0.9; margin-top: 4px; }
.hero .kasavu { margin: 18px -20px 0; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--gold); border-radius: 10px; padding: 14px; min-width: 0; }
.stat b { display: block; font-family: var(--font-display); font-size: 1.9rem; line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--accent); }
.stat span { color: var(--muted); font-size: 0.85rem; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; min-width: 0; }
.card.gold { background: var(--gold-soft); border-color: var(--gold); color: var(--gold-ink); }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.stack { display: grid; gap: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 14px; }

.btn { border: 0; background: var(--primary); color: var(--primary-ink); font-weight: 800; padding: 12px 20px; border-radius: 999px; font-size: 1rem; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; justify-content: center; min-height: 46px; }
.btn.gold { background: var(--gold); color: #2A1E00; }
.btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--line); }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.btn svg, .icon { width: 20px; height: 20px; flex: none; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 800; background: var(--surface2); color: var(--muted); }
.pill.good { background: var(--good-bg); color: var(--good); }
.pill.gold { background: var(--gold-soft); color: var(--gold-ink); border: 1px solid var(--gold); }
.bar-track { height: 10px; background: var(--surface2); border-radius: 999px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--primary); border-radius: 999px; }
.bar-fill.gold { background: var(--gold); }

/* weekly chart */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 150px; }
.week div { display: grid; grid-template-rows: 1fr auto auto; height: 100%; text-align: center; font-size: 0.78rem; color: var(--muted); gap: 2px; }
.week i { align-self: end; background: var(--primary); border-radius: 8px 8px 3px 3px; min-height: 4px; width: 100%; }
.week i.zero { background: var(--surface2); }
.week b { color: var(--ink); font-variant-numeric: tabular-nums; }

/* topic list */
.level h2 { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.tcard { display: grid; gap: 8px; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--gold); border-radius: 10px; padding: 14px; text-decoration: none; color: var(--ink); min-width: 0; }
.tcard:hover { border-color: var(--primary); }
.tcard.locked { opacity: 0.6; cursor: not-allowed; }
.tcard .t1 { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
.tcard .tn { font-weight: 800; font-size: 1.05rem; }
.tcard .tm { font-family: var(--font-ml); font-size: 1.5rem; font-weight: 700; line-height: 1.1; }
.tcard .meta { display: flex; flex-wrap: wrap; gap: 6px; }

/* topic page */
.crumb { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.crumb a { text-decoration: none; font-weight: 700; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.steps button { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 10px 6px; font-weight: 800; font-size: 0.92rem; min-width: 0; }
.steps button[aria-selected="true"] { background: var(--hero); border-color: var(--hero); color: var(--hero-ink); }
.steps small { display: block; font-weight: 600; opacity: 0.8; }

.flash { background: var(--surface); border: 6px double var(--gold); border-radius: 6px; padding: 22px 18px 18px; text-align: center; display: grid; gap: 10px; justify-items: center; outline: 2px solid var(--hero); outline-offset: 3px; margin: 5px; }
.glyph { font-family: var(--font-ml); font-weight: 800; line-height: 1.05; font-size: clamp(3.6rem, 20vw, 7rem); }
.glyph.word { font-size: clamp(2.2rem, 11vw, 3.8rem); }
.glyph.sent { font-size: clamp(1.7rem, 7.5vw, 2.6rem); }
.rom { font-size: 1.25rem; font-weight: 800; color: var(--primary); }
.mean { display: grid; gap: 2px; }
.mean .ta { font-size: 1.35rem; font-weight: 700; }
.example { background: var(--surface2); border-radius: 14px; padding: 12px 16px; width: 100%; display: grid; gap: 2px; }
.example .ml { font-size: 1.7rem; font-weight: 700; }
.dots { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--primary); }
.dots i.cur { background: var(--gold); transform: scale(1.35); }
.tip { display: grid; gap: 4px; }
.tip p { font-size: 0.95rem; }

.q { display: grid; gap: 14px; }
.qprompt { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px 16px; text-align: center; display: grid; gap: 6px; justify-items: center; }
.opts { display: grid; gap: 10px; }
.opt { text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; min-height: 54px; display: grid; gap: 1px; width: 100%; }
.opt:hover:not([disabled]) { border-color: var(--primary); }
.opt .ml { font-size: 1.6rem; font-weight: 700; line-height: 1.2; }
.opt .ta { font-size: 1.15rem; font-weight: 700; }
.opt.right { background: var(--good-bg); border-color: var(--good); }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad); }
.fb { border-radius: 14px; padding: 12px 14px; display: grid; gap: 2px; }
.fb.good { background: var(--good-bg); color: var(--ink); border: 1px solid var(--good); }
.fb.bad { background: var(--bad-bg); color: var(--ink); border: 1px solid var(--bad); }
.score { font-family: var(--font-display); font-size: 3.4rem; font-weight: 800; line-height: 1; }

.mic-wrap { display: grid; gap: 10px; justify-items: center; text-align: center; }
.mic { width: 96px; height: 96px; border-radius: 50%; border: 0; background: var(--primary); color: var(--primary-ink); display: grid; place-items: center; box-shadow: 0 0 0 8px var(--surface2); }
.mic svg { width: 40px; height: 40px; }
.mic.on { background: var(--bad); animation: pulse 1.3s ease-in-out infinite; }
.mic[disabled] { opacity: 0.6; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 6px var(--bad-bg); } 50% { box-shadow: 0 0 0 16px var(--bad-bg); } }
@media (prefers-reduced-motion: reduce) { .mic.on { animation: none; } }
.live { min-height: 2.2em; font-family: var(--font-ml); font-size: 1.4rem; font-weight: 600; word-break: break-word; }
.res-list { display: grid; gap: 8px; }
.res-row { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--surface2); }
.res-row .ml { font-size: 1.25rem; font-weight: 700; }
.tbl { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
.tbl th { text-align: left; font-size: 0.72rem; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); padding: 6px 8px; }
.tbl td { padding: 9px 8px; border-top: 1px solid var(--line); vertical-align: middle; }
.scroll { overflow-x: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--surface2); border-radius: 12px; padding: 8px 12px; display: grid; }
.chip .ml { font-size: 1.3rem; font-weight: 700; line-height: 1.2; }
.foot { margin-top: 28px; text-align: center; }

/* bottom tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; justify-content: center; padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 60%, transparent); pointer-events: none; }
.tabs nav { pointer-events: auto; display: flex; gap: 2px; background: var(--hero); padding: 6px; border-radius: 999px; box-shadow: 0 6px 20px rgba(0,0,0,0.28); width: 100%; max-width: 520px; }
.tabs a { flex: 1; min-width: 0; display: grid; justify-items: center; align-content: center; gap: 1px; padding: 6px 2px; border-radius: 999px; color: var(--hero-ink); text-decoration: none; font-size: 0.68rem; font-weight: 800; line-height: 1.2; }
.tabs a svg { width: 22px; height: 22px; }
.tabs a .glyph-ic { font-family: var(--font-ml); font-size: 1.3rem; font-weight: 800; line-height: 22px; height: 22px; }
.tabs a[aria-current="page"] { background: var(--gold); color: #2A1E00; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(100px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; z-index: 40; width: max-content; max-width: min(92%, 420px); font-size: 0.9rem; text-align: center; }
.spk { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface2); color: var(--ink); display: grid; place-items: center; padding: 0; flex: none; }
.btn.sm { padding: 8px 14px; font-size: 0.9rem; }
.tilelink { text-decoration: none; color: var(--ink); }
.tilelink:hover { border-color: var(--primary); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--gold); border-radius: 12px; padding: 8px 4px; display: grid; justify-items: center; gap: 0; min-width: 0; }
.tile .g { font-family: var(--font-ml); font-size: 1.9rem; font-weight: 700; line-height: 1.25; }
.tile .small { color: var(--muted); font-weight: 700; }
.tile .tamil { font-family: var(--font-ta); font-size: 0.95rem; font-weight: 700; color: var(--primary); line-height: 1.3; }
.tile.sel .tamil { color: var(--gold-soft); }
.tile.sel { background: var(--hero); border-color: var(--hero); color: var(--hero-ink); }
.tile.sel .small { color: var(--gold-soft); }
.sheet { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); width: min(520px, calc(100% - 24px)); z-index: 25; background: var(--surface); border: 3px double var(--gold); border-radius: 14px; padding: 12px 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 8px 14px; align-items: center; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
.sheet .big { font-family: var(--font-ml); font-size: 3rem; font-weight: 800; line-height: 1.1; }
.sheet .acts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; }
.spacer { height: 170px; }
</style>

  <header class="top">
    <div class="bar">

<script>
/* ---------- DATA ---------- */
function L(ml, rom, ta, en, w) { return { letter: true, ml: ml, rom: rom, ta: ta, en: en, w: w ? { ml: w[0], rom: w[1], ta: w[2], en: w[3] } : null, alts: [] }; }
function W(ml, rom, ta, en, alts) { return { ml: ml, rom: rom, ta: ta, en: en, alts: alts || [] }; }

var LEVELS = [
  { id: 'l1', name: 'Level 1', title: 'Letters', ml: 'അക്ഷരമാല', sub: 'The Malayalam alphabet, the way Kerala children start', topics: [
    { id: 'vowels', name: 'Vowels', ml: 'സ്വരങ്ങൾ', kind: 'letter',
      tip: 'Say each vowel out loud three times, then say its example word. Kerala children chant the vowels in order, so chant along.',
      bridge: 'Almost every vowel has the same shape of sound as Tamil. அ ஆ இ ஈ உ ஊ எ ஏ ஐ ஒ ஓ ஔ all exist in Malayalam.',
      items: [
        L('അ', 'a', 'அ', 'short "a", as in "but"', ['അമ്മ', 'amma', 'அம்மா', 'mother']),
        L('ആ', 'aa', 'ஆ', 'long "aa"', ['ആന', 'aana', 'யானை', 'elephant']),
        L('ഇ', 'i', 'இ', 'short "i"', ['ഇല', 'ila', 'இலை', 'leaf']),
        L('ഈ', 'ee', 'ஈ', 'long "ee"', ['ഈച്ച', 'eecha', 'ஈ', 'fly']),
        L('ഉ', 'u', 'உ', 'short "u"', ['ഉപ്പ്', 'uppu', 'உப்பு', 'salt']),
        L('ഊ', 'oo', 'ஊ', 'long "oo"', ['ഊഞ്ഞാൽ', 'oonjaal', 'ஊஞ்சல்', 'swing']),
        L('ഋ', 'ru', 'ரு', 'vowel "ri", used in Sanskrit words', ['ഋഷി', 'rishi', 'முனிவர்', 'sage']),
        L('എ', 'e', 'எ', 'short "e"', ['എലി', 'eli', 'எலி', 'rat']),
        L('ഏ', 'ae', 'ஏ', 'long "ae"', ['ഏണി', 'eni', 'ஏணி', 'ladder']),
        L('ഐ', 'ai', 'ஐ', '"ai" as in "aisle"', ['ഐസ്', 'ais', 'ஐஸ்', 'ice']),
        L('ഒ', 'o', 'ஒ', 'short "o"', ['ഒട്ടകം', 'ottakam', 'ஒட்டகம்', 'camel']),
        L('ഓ', 'oh', 'ஓ', 'long "o"', ['ഓറഞ്ച്', 'oranj', 'ஆரஞ்சு', 'orange']),
        L('ഔ', 'au', 'ஔ', '"au" as in "cow"', ['ഔഷധം', 'aushadham', 'மருந்து', 'medicine'])
      ] },
    { id: 'cons1', name: 'Consonants 1', ml: 'ക മുതൽ ഞ വരെ', kind: 'letter',
      tip: 'Learn these in pairs: the plain sound first, then its breathy twin. Breathy letters have more air, like saying "k" and then "kh".',
      bridge: 'Tamil has no breathy letters, so ഖ ഗ ഘ use க in Tamil writing. Malayalam writes them separately.',
      items: [

function norm(s) {
  s = String(s || '').normalize('NFC').toLowerCase().replace(/[‌‍]/g, '');
  var chillu = { 'ൻ': 'ന്', 'ൺ': 'ണ്', 'ർ': 'ര്', 'ൽ': 'ല്', 'ൾ': 'ള്', 'ൿ': 'ക്' };
  s = s.replace(/[ൻൺർൽൾൿ]/g, function (c) { return chillu[c]; });
  var lv = { 'ീ': 'ി', 'ൂ': 'ു', 'േ': 'െ', 'ോ': 'ൊ', 'ഈ': 'ഇ', 'ഊ': 'ഉ', 'ഏ': 'എ', 'ഓ': 'ഒ', 'ം': 'മ' };
  s = s.replace(/[ീൂേോഈഊഏഓം]/g, function (c) { return lv[c]; });
  s = s.replace(/്/g, '');
  return s.replace(/[^\p{L}\p{M}\p{N}]/gu, '');
}
function lev(a, b) {
  var m = a.length, n = b.length, i, j;
  if (!m) return n; if (!n) return m;
  var p = []; for (j = 0; j <= n; j++) p[j] = j;
  for (i = 1; i <= m; i++) {
    var c = [i];
    for (j = 1; j <= n; j++) c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    p = c;
  }
  return p[n];
}
function sim(a, b) { if (!a || !b) return 0; return 1 - lev(a, b) / Math.max(a.length, b.length); }

  var cands = [t.ml, t.rom].concat(t.alts || []), best = 0;
  cands.forEach(function (c) { var v = sim(s, norm(c)); if (v > best) best = v; });
  return best;
}

function optHtml(it, type) {
  if (type === 'ml2ta') return '<span class="ta">' + esc(it.ta) + '</span><span class="small muted">' + esc(it.en) + '</span>';
  if (type === 'ta2ml') return '<span class="ml">' + esc(it.ml) + '</span>';
  if (type === 'ml2rom') return '<span class="rom">' + esc(it.rom) + '</span>';
  return '<span class="ml">' + esc(it.ml) + '</span>';
}
function makeQ(item, pool) {
  var types = item.letter ? ['ml2rom', 'rom2ml'] : ['ml2ta', 'ta2ml'];
  var type = types[Math.floor(Math.random() * 2)];
  var same = pool.filter(function (x) { return x.key !== item.key && !!x.letter === !!item.letter && x.ml !== item.ml && x.ta !== item.ta && x.en !== item.en && x.rom !== item.rom; });
  var opts = shuffle(shuffle(same).slice(0, 3).concat([item]));

}
function promptHtml(q) {
  var it = q.item;

  return '<div class="label">Pick the letter for this sound</div><div class="rom" style="font-size:2.6rem">' + esc(it.rom) + '</div><div class="muted small">Tamil: ' + esc(it.ta) + '</div>';
}
function quizHtml(qz, kind) {
  var q = qz.qs[qz.i], picked = q.picked !== null;
  var h = '<div class="q"><div class="row"><span class="label">Question ' + (qz.i + 1) + ' of ' + qz.qs.length + '</span><span class="pill gold">' + qz.score + ' correct</span></div>';

  h += '<div class="qprompt">' + promptHtml(q) + '</div><div class="opts">';
  q.opts.forEach(function (o, idx) {
    var cls = 'opt';
    if (picked) { if (o.key === q.item.key) cls += ' right'; else if (idx === q.picked) cls += ' wrong'; }
    h += '<button class="' + cls + '" data-act="pick" data-i="' + idx + '" data-kind="' + kind + '"' + (picked ? ' disabled' : '') + '>' + optHtml(o, q.type) + '</button>';

  }

}
function pickAnswer(qz, idx) {
  var q = qz.qs[qz.i]; if (q.picked !== null) return;

  h += '<div class="stack" style="gap:2px"><h2>' + esc(t.name) + ' <span class="ml muted">' + esc(t.ml) + '</span></h2></div>';
  h += '<div class="steps" role="tablist">' + [['lesson', '1. Lesson', 'Learn'], ['quiz', '2. Practice', 'Quiz'], ['voice', '3. Voice test', 'Speak']].map(function (s) {
    return '<button role="tab" data-act="mode" data-m="' + s[0] + '" aria-selected="' + (m === s[0]) + '">' + s[1] + '<small>' + s[2] + '</small></button>';
  }).join('') + '</div>';
  if (m === 'lesson') h += lessonHtml(t);
  else if (m === 'quiz') h += topicQuizHtml(t);
  else h += voiceHtml(t);
  return h;
}
function lessonHtml(t) {
  var L0 = sess.lesson || (sess.lesson = { i: 0 }), it = t.items[L0.i], last = L0.i === t.items.length - 1;
  var h = '<div class="card tip"><span class="label">Kerala-kids tip</span><p>' + esc(t.tip) + '</p><p class="muted"><b>Tamil bridge:</b> ' + esc(t.bridge) + '</p></div>';
  h += '<div class="flash"><span class="label">' + (L0.i + 1) + ' of ' + t.items.length + '</span>';
  h += '<div class="glyph ' + (it.letter ? '' : it.ml.length > 12 ? 'sent' : 'word') + '">' + esc(it.ml) + '</div><div class="rom">' + esc(it.rom) + '</div>';
  if (it.letter) {
    h += '<div class="mean"><span class="ta">' + esc(it.ta) + '</span><span class="muted small">' + esc(it.en) + '</span></div>';
    if (it.w) h += '<div class="example"><span class="label">Example word</span><span class="ml">' + esc(it.w.ml) + '</span><span><b>' + esc(it.w.rom) + '</b> · <span class="ta">' + esc(it.w.ta) + '</span> · ' + esc(it.w.en) + '</span></div>';
    else h += '<div class="example"><span class="small muted">A rare letter. It appears mostly in words borrowed from Sanskrit, so it has no example word in the voice test.</span></div>';
  } else {
    h += '<div class="mean"><span class="ta">' + esc(it.ta) + '</span><span class="muted">' + esc(it.en) + '</span></div>';
  }
  h += '<div class="row" style="justify-content:center;gap:8px">' + (it.letter ? spkBtn(it.ml, 'Hear letter') + (it.w ? spkBtn(it.w.ml, 'Hear word') : '') : spkBtn(it.ml, 'Hear it') + spkBtn(it.ml, 'Slow', true)) + '</div>';
  h += '</div><div class="dots" aria-hidden="true">' + t.items.map(function (_, i) { return '<i class="' + (i < L0.i ? 'on' : i === L0.i ? 'cur' : '') + '"></i>'; }).join('') + '</div>';
  h += '<div class="row"><button class="btn ghost" data-act="lprev"' + (L0.i === 0 ? ' disabled' : '') + '>Back</button>' + (last ? '<button class="btn gold" data-act="lfinish">Finish lesson</button>' : '<button class="btn" data-act="lnext">Next</button>') + '</div>';
  h += '<label class="small muted" style="display:flex;gap:8px;align-items:center;justify-content:center"><input type="checkbox" data-act="auto"' + (S.auto ? ' checked' : '') + '> Play the sound automatically on each card</label>';
  if (!ttsOK) h += '<p class="small muted">Tip: your device has no Malayalam voice for playback. Read the pronunciation under each word and say it aloud.</p>';
  return h;
}
function startTopicQuiz(t) {
  var n = Math.min(10, t.items.length), pool = t.items;
  sess.quiz = { qs: shuffle(t.items).slice(0, n).map(function (it) { return makeQ(it, pool); }), i: 0, score: 0, done: false };
}
function topicQuizHtml(t) {
  var qz = sess.quiz;
  if (!qz) return '<div class="card stack"><h3>Practice quiz</h3><p class="muted">Up to 10 questions on ' + esc(t.name) + '. You earn 10 points for each correct answer.</p><div><button class="btn" data-act="qstart">Start quiz</button></div></div>';
  if (qz.done) {
    var pc = Math.round(qz.score / qz.qs.length * 100);
    return '<div class="card stack" style="text-align:center;justify-items:center"><span class="label">Quiz result</span><div class="score">' + qz.score + ' / ' + qz.qs.length + '</div><p class="muted">' + (pc >= 80 ? 'Wonderful. You are ready for the voice test.' : pc >= 50 ? 'Good progress. One more round makes it stick.' : 'Go back to the lesson, then try again.') + '</p><div class="row"><button class="btn ghost" data-act="qstart">Try again</button><button class="btn" data-act="mode" data-m="voice">Go to voice test</button></div></div>';
  }
  return quizHtml(qz, 'topic');
}

/* ---------- VOICE TEST ---------- */
function voiceMode() { return dict && !mlBad ? 'mic' : 'self'; }
function startVoice(t) {
  var items = shuffle(voiceItems(t)).slice(0, 8);
  sess.voice = { items: items, i: 0, tries: 0, res: [], hint: false, verdict: null, done: false };
  vs.finals = ''; vs.partial = ''; vs.evaluated = false; dictMsg = '';
}
function voiceHtml(t) {
  var v = sess.voice;
  if (!v) {
    var h = '<div class="card stack"><h3>Voice test</h3><p>You will see the meaning in English and Tamil. Say it in Malayalam out loud. ' + voiceItems(t).length + ' items are available, and each test uses up to 8.</p>';
    h += voiceMode() === 'mic' ? '<p class="small muted">Your voice is turned into text and compared with the Malayalam answer. You get two tries per item. Allow the microphone when asked.</p>' : '<p class="small muted"><b>Voice recognition is not available in this view.</b> You will say each answer aloud and mark yourself honestly. For automatic checking, open this page in desktop Chrome or Edge, signed in to claude.ai.</p>';
    if (!S.learned[t.id]) h += '<p class="small muted">Tip: finish the lesson first so the answers feel familiar.</p>';
    return h + '<div><button class="btn" data-act="vstart">Start voice test</button></div></div>';
  }
  if (v.done) {
    var ok = v.res.filter(function (r) { return r && r.ok; }).length, pc = Math.round(ok / v.items.length * 100), pass = pc >= 60;
    var h2 = '<div class="card stack" style="text-align:center;justify-items:center"><span class="label">Voice test result</span><div class="score">' + ok + ' / ' + v.items.length + '</div><p>' + (pass ? '<span class="pill good">Passed</span> ' + (S.done[t.id] ? 'Topic finished.' : '') : '<span class="pill gold">Not yet</span> You need 60% to pass.') + '</p>';
    h2 += '<div class="res-list" style="width:100%;text-align:left">' + v.items.map(function (it, i) { var r = v.res[i] || {}, tg = target(it); return '<div class="res-row"><span class="pill ' + (r.ok ? 'good' : '') + '">' + (r.ok ? 'Right' : 'Retry') + '</span><span><span class="ml">' + esc(tg.ml) + '</span> <span class="small muted">' + esc(tg.rom) + ' · ' + esc(tg.en) + '</span></span></div>'; }).join('') + '</div>';
    h2 += '<div class="row"><button class="btn ghost" data-act="vstart">Test again</button>' + (pass && t.index + 1 < TOPICS.length ? '<a class="btn" href="#t-' + TOPICS[t.index + 1].id + '">Next topic</a>' : '<a class="btn" href="#learn">Back to topics</a>') + '</div></div>';
    return h2;
  }
  var it = v.items[v.i], tg = target(it), mode = voiceMode();
  var h3 = '<div class="q"><div class="row"><span class="label">Item ' + (v.i + 1) + ' of ' + v.items.length + '</span></div><div class="bar-track"><div class="bar-fill gold" style="width:' + Math.round(v.i / v.items.length * 100) + '%"></div></div>';
  h3 += '<div class="qprompt"><div class="label">Say this in Malayalam</div><div style="font-family:var(--font-display);font-size:1.8rem;font-weight:800">' + esc(tg.en) + '</div><div class="ta" style="font-size:1.5rem;font-weight:700">' + esc(tg.ta) + '</div>';
  if (v.hint || v.verdict) h3 += '<div class="example" style="text-align:center;margin-top:6px"><span class="ml" style="font-size:2rem">' + esc(tg.ml) + '</span><b class="rom" style="font-size:1.1rem">' + esc(tg.rom) + '</b>' + spkBtn(tg.ml, 'Hear it') + '</div>';
  h3 += '</div>';
  var v2 = v.verdict;
  if (!v2) {
    h3 += '<div class="row" style="justify-content:center">' + (v.hint ? spkBtn(tg.ml) : '<button class="btn ghost" data-act="vhint">Show hint</button>') + '</div>';
    if (mode === 'mic') {
      h3 += '<div class="mic-wrap"><button class="mic' + (vs.state === 'listening' ? ' on' : '') + '" id="micbtn" data-act="mic" aria-label="Speak"' + (vs.state === 'starting' || vs.state === 'finishing' ? ' disabled' : '') + '>' + ICON.mic + '</button><div id="micstat" class="small muted">' + micLabel() + '</div><div class="live" id="live" aria-live="polite">' + esc(vs.finals + ' ' + vs.partial) + '</div>' + (dictMsg ? '<div class="fb bad small">' + esc(dictMsg) + '</div>' : '') + '</div>';
    } else {
      h3 += '<div class="card stack"><p>Say it aloud now. Then tell me how it went.</p><div class="row"><button class="btn" data-act="selfok">I said it right</button><button class="btn ghost" data-act="selfno">Need more practice</button></div></div>';
    }
  } else {
    var good = v2.ok;
    h3 += '<div class="fb ' + (good ? 'good' : 'bad') + '"><b>' + (good ? 'Well said' : v2.self ? 'Keep practising' : v2.said ? 'Not quite' : 'I did not hear anything') + '</b>' + (v2.said ? '<span>I heard: <span class="ml" style="font-weight:700">' + esc(v2.said) + '</span> (' + Math.round(v2.sim * 100) + '% match)</span>' : '') + '</div>';
    if (good || v2.final) {
      h3 += '<div class="row">' + (!good && !v2.self ? '<button class="btn ghost" data-act="vover">I said it right</button>' : '<span></span>') + '<button class="btn" data-act="vnext">' + (v.i + 1 >= v.items.length ? 'Finish test' : 'Next') + '</button></div>';
    } else {
      h3 += '<div class="row"><button class="btn" data-act="vretry">Try again</button></div>';
    }
  }
  return h3 + '</div>';
}
function micLabel() { return vs.state === 'listening' ? 'Listening. Speak now, then pause.' : vs.state === 'starting' ? 'Getting ready' : vs.state === 'finishing' ? 'Checking what you said' : 'Tap the microphone and speak'; }
function updateMic() {
  var b = document.getElementById('micbtn'), s = document.getElementById('micstat'), l = document.getElementById('live');
  if (b) { b.classList.toggle('on', vs.state === 'listening'); b.disabled = vs.state === 'starting' || vs.state === 'finishing'; }
  if (s) s.textContent = micLabel();
  if (l) l.textContent = (vs.finals + ' ' + vs.partial).trim();
}
function recordVoice(ok, said, sc, self, final) {
  var v = sess.voice; v.verdict = { ok: ok, said: said, sim: sc, self: !!self, final: !!final };
  if (ok || final) {
    v.res[v.i] = { ok: ok, said: said }; addAct(1);
    var it = v.items[v.i];
    if (ok) { award(15); if (S.miss[it.key]) S.miss[it.key]--; } else S.miss[it.key] = (S.miss[it.key] || 0) + 1;
    save();
  }
}
function evaluateOnce() {
  if (vs.evaluated || view.n !== 'topic' || view.mode !== 'voice' || !sess.voice || sess.voice.done || sess.voice.verdict) return;
  vs.evaluated = true; clearTimeout(vs.timer);
  var v = sess.voice, it = v.items[v.i], tg = target(it), said = (vs.finals || vs.partial || '').trim();
  if (!said) { v.verdict = { ok: false, said: '', sim: 0, final: false }; v.tries++; if (v.tries >= 2) { recordVoice(false, '', 0, false, true); } render(); return; }
  var sc = matchScore(said, tg), thr = it.topic.kind === 'sentence' ? 0.55 : 0.6, ok = sc >= thr;
  v.tries++;
  recordVoice(ok, said, sc, false, !ok && v.tries >= 2);
  render();
}
function finishVoice(t) {
  var v = sess.voice, ok = v.res.filter(function (r) { return r && r.ok; }).length, pc = Math.round(ok / v.items.length * 100);
  v.done = true;
  S.voice[t.id] = Math.max(S.voice[t.id] || 0, pc);
  if (pc >= 60 && !S.done[t.id]) { S.done[t.id] = true; award(30); addLog('Passed the voice test: ' + t.name + ' (' + pc + '%)'); } else addLog('Voice test: ' + t.name + ' (' + pc + '%)');
  save();
}

/* ---------- DAILY QUIZ ---------- */
function learnedPool() { var p = []; TOPICS.forEach(function (t) { if (S.learned[t.id]) p = p.concat(t.items); }); return p; }
function buildDaily() {
  var pool = learnedPool(); if (pool.length < 5) return null;
  var bag = [];
  pool.forEach(function (it) { var w = 1 + 2 * (S.miss[it.key] || 0); for (var i = 0; i < w; i++) bag.push(it); });
  var chosen = [], seen = {};
  shuffle(bag).forEach(function (it) { if (chosen.length < 10 && !seen[it.key]) { seen[it.key] = 1; chosen.push(it); } });
  return { qs: chosen.map(function (it) { return makeQ(it, pool); }), i: 0, score: 0, done: false };
}
function dailyView() {
  var t = today();
  if (!dq) {
    var d = S.daily[t], pool = learnedPool();
    var h = '<div class="stack"><h2>Daily quiz</h2><p class="muted">Ten questions, mixed from the topics you have already learned. Words you missed before come back more often.</p></div>';
    if (pool.length < 5) return h + '<div class="card stack"><h3>Learn something first</h3><p class="muted">Finish at least one lesson, then your daily quiz unlocks.</p><div><a class="btn" href="#learn">Go to lessons</a></div></div>';
    h += '<div class="card ' + (d ? '' : 'gold') + ' stack">' + (d ? '<h3>Today\'s best score: ' + d.s + ' of ' + d.t + '</h3><p class="muted">You can play again for extra practice. Your best score of the day is kept.</p>' : '<h3>Not played yet today</h3><p>Keep your streak alive with a short round.</p>') + '<div><button class="btn ' + (d ? '' : 'gold') + '" data-act="dstart">' + (d ? 'Play again' : 'Start daily quiz') + '</button></div></div>';
    return h;
  }
  if (dq.done) {
    var pc = Math.round(dq.score / dq.qs.length * 100);
    return '<div class="card stack" style="text-align:center;justify-items:center"><span class="label">Daily quiz result</span><div class="score">' + dq.score + ' / ' + dq.qs.length + '</div><p class="muted">' + (pc >= 80 ? 'Excellent. Your Malayalam is growing.' : pc >= 50 ? 'Good work. Review the words below on your dashboard.' : 'Keep going. Repetition is how it sticks.') + '</p><div class="row"><button class="btn ghost" data-act="dstart">Play again</button><a class="btn" href="#dashboard">See dashboard</a></div></div>';
  }
  return '<div class="stack"><h2>Daily quiz</h2></div>' + quizHtml(dq, 'daily');
}

/* ---------- RENDER ---------- */
function render(scroll) {
  document.querySelectorAll('nav a').forEach(function (a) { var on = a.dataset.nav === (view.n === 'topic' ? 'learn' : view.n); if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  app.innerHTML = view.n === 'learn' ? learnView() : view.n === 'topic' ? topicView() : view.n === 'daily' ? dailyView() : view.n === 'dashboard' ? dashboardView() : view.n === 'letters' ? lettersView() : homeView();
  var f = document.getElementById('foot');
  f.textContent = storeOK ? 'Your progress is saved automatically.' : 'Progress could not be saved in this view. Open the page in a normal browser tab to keep it.';
  if (scroll) window.scrollTo(0, 0);
}

/* ---------- EVENTS ---------- */
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  var a = b.dataset.act, t = view.n === 'topic' ? topicById(view.id) : null;
  if (a === 'speak') { speak(b.dataset.text, b.dataset.slow === '1'); return; }
  if (a === 'alpha') { var ai = alphaItem(b.dataset.k); view.sel = b.dataset.k; if (ai) speak(ai.say); render(); return; }
  if (a === 'aclose') { view.sel = null; render(); return; }
  if (a === 'auto') { S.auto = !S.auto; save(); return; }
  if (a === 'unlock') { S.unlockAll = !S.unlockAll; save(); render(); return; }
  if (a === 'mode') { view.mode = b.dataset.m; if (b.dataset.m === 'voice' && sess.voice && sess.voice.done) sess.voice = null; render(true); return; }
  if (a === 'lnext') { sess.lesson.i++; if (S.auto) speak(t.items[sess.lesson.i].ml); render(); return; }
  if (a === 'lprev') { sess.lesson.i--; if (S.auto) speak(t.items[sess.lesson.i].ml); render(); return; }
  if (a === 'lfinish') { if (!S.learned[t.id]) { S.learned[t.id] = true; award(20); addAct(1); addLog('Finished lesson: ' + t.name); save(); } view.mode = 'quiz'; render(true); return; }
  if (a === 'qstart') { startTopicQuiz(t); render(true); return; }
  if (a === 'dstart') { dq = buildDaily(); render(true); return; }
  if (a === 'pick') { var qz = b.dataset.kind === 'daily' ? dq : sess.quiz; pickAnswer(qz, +b.dataset.i); render(); return; }
  if (a === 'qnext') {
    var z = b.dataset.kind === 'daily' ? dq : sess.quiz; z.i++;
    if (z.i >= z.qs.length) {
      z.done = true;
      var pc = Math.round(z.score / z.qs.length * 100);
      if (b.dataset.kind === 'daily') { var old = S.daily[today()]; if (!old || z.score > old.s) S.daily[today()] = { s: z.score, t: z.qs.length }; addLog('Daily quiz: ' + z.score + ' of ' + z.qs.length); award(10); }
      else { S.quiz[t.id] = Math.max(S.quiz[t.id] || 0, pc); addLog('Practice quiz: ' + t.name + ' (' + pc + '%)'); }
      save();
    }
    render(true); return;
  }
  if (a === 'vstart') { startVoice(t); render(true); return; }
  if (a === 'vhint') { sess.voice.hint = true; render(); return; }
  if (a === 'vretry') { sess.voice.verdict = null; vs.finals = ''; vs.partial = ''; vs.evaluated = false; render(); return; }
  if (a === 'vnext') {
    var v = sess.voice; v.i++; v.tries = 0; v.hint = false; v.verdict = null; vs.finals = ''; vs.partial = ''; vs.evaluated = false;
    if (v.i >= v.items.length) finishVoice(t);
    render(true); return;
  }
  if (a === 'selfok') { recordVoice(true, '', 1, true, true); render(); return; }
  if (a === 'selfno') { recordVoice(false, '', 0, true, true); render(); return; }
  if (a === 'vover') {
    var v3 = sess.voice; v3.res[v3.i] = { ok: true, said: v3.verdict.said }; var itm = v3.items[v3.i];
    S.miss[itm.key] = Math.max(0, (S.miss[itm.key] || 1) - 1); award(10); v3.verdict.ok = true; save(); render(); return;
  }
  if (a === 'mic') {
    if (!dict) return;
    if (dict.active()) { stopListening(); return; }
    vs.finals = ''; vs.partial = ''; vs.evaluated = false; dictMsg = '';
    dict.start({ language: 'ml' }).catch(function (err) {
      var c = err && err.code;
      if (c === 'unavailable') { mlBad = true; dictMsg = 'Malayalam voice recognition is not available for this account. You can still practise with self-marking.'; }
      else if (c === 'not_granted') dictMsg = 'The microphone was not allowed. Allow it for this page, or practise with self-marking.';
      else if (c === 'stopped' || c === 'dismissed') dictMsg = '';
      else dictMsg = 'Could not start the microphone. Please try again.';
      if (view.n === 'topic' && view.mode === 'voice') render();
    });
    return;
  }
});
function stopListening() {
  clearTimeout(vs.timer);
  Promise.resolve(dict.stop()).catch(function () { }).then(function () { evaluateOnce(); });
}

/* ---------- CAPABILITIES ---------- */
function wireDictation() {
  dict.onPartial(function (e) { vs.partial = e.text || ''; updateMic(); });
  dict.onFinal(function (e) {
    vs.finals = (vs.finals + e.text).replace(/^\s+/, ''); vs.partial = ''; updateMic();
    clearTimeout(vs.timer); vs.timer = setTimeout(function () { if (dict.active()) stopListening(); else evaluateOnce(); }, 1600);
  });
  dict.onState(function (e) {
    vs.state = e.state; updateMic();
    if (e.state === 'idle') {
      if (e.reason === 'unavailable') { mlBad = true; dictMsg = 'Malayalam voice recognition is not available for this account. You can still practise with self-marking.'; render(); }
      else if (e.reason === 'not_granted') { dictMsg = 'The microphone was not allowed. Allow it for this page, or practise with self-marking.'; render(); }
      else if (vs.finals) evaluateOnce();
    }
  });
}
function initCaps() {
  if (!(window.claude && typeof window.claude.use === 'function')) return;
  window.claude.use('dictation').then(function (d) { if (d) { dict = d; wireDictation(); render(); } }).catch(function () { });
  Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function (r) {
    var db = r[0], user = r[1]; if (!db || !user) return;
    return user.id().then(function (id) {
      if (!id) return;
      dbDoc = db.doc('data/users/' + id + '/progress');
      return dbDoc.get().then(function (snap) {
        if (snap.exists) {
          var st = JSON.parse(snap.data().state);
          if ((st.savedAt || 0) > (S.savedAt || 0)) { S = Object.assign(blank(), st); saveLocal(); render(); }
          else if ((S.savedAt || 0) > (st.savedAt || 0)) queueDb();
        } else if (S.savedAt) queueDb();
      });
    });
  }).catch(function () { });
}

/* ---------- START ---------- */
loadLocal();
checkTts();
try { if (window.speechSynthesis) speechSynthesis.addEventListener('voiceschanged', function () { checkTts(); }); } catch (e) { }
route();
initCaps();
</script>
